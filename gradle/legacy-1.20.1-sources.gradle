ext.translateOldResourceLocation = { String line ->
    line
        .replace('ResourceLocation.fromNamespaceAndPath(', 'new ResourceLocation(')
        .replace('ResourceLocation.tryBuild(', 'ResourceLocation.tryParse(')
        .replace('ResourceLocation.tryParse(KaleidoscopeDoll.MOD_ID, path)', 'ResourceLocation.tryParse(KaleidoscopeDoll.MOD_ID + ":" + path)')
        .replace('ResourceLocation.withDefaultNamespace(', 'new ResourceLocation(')
        .replace('ResourceLocation.parse(', 'new ResourceLocation(')
}

ext.translateLegacyVertexLine = { String line ->
    line.replace("consumer.addVertex(", "consumer.vertex(")
        .replace(".setColor(", ".color(")
        .replace(".setUv(", ".uv(")
        .replace(".setOverlay(", ".overlayCoords(")
        .replace(".setLight(", ".uv2(")
        .replaceAll(/\.setNormal\((.+)\);/, '.normal($1).endVertex();')
}

ext.translateBeforeComponentsLine = { String line, String version ->
    line = translateOldResourceLocation(line)
    if (version == "1.20.1") {
        line = line.replaceAll(/(public (?:DollEntityCraftingRecipe|DollFunctionRecipe)\()CraftingBookCategory category\) \{ super\(category\);/, '$1net.minecraft.resources.ResourceLocation id, CraftingBookCategory category) { super(id, category);')
    }
    if (version != "1.20.4") {
        line = line.replace('public BlockState playerWillDestroy(', 'public void playerWillDestroy(')
            .replace('return super.playerWillDestroy(', 'super.playerWillDestroy(')
    }
    line
        .replace('software.bernie.geckolib.animation.PlayState', 'software.bernie.geckolib.core.object.PlayState')
        .replace('software.bernie.geckolib.animation.', 'software.bernie.geckolib.core.animation.')
        .replace('software.bernie.geckolib.animatable.GeoAnimatable', 'software.bernie.geckolib.core.animatable.GeoAnimatable')
        .replace('software.bernie.geckolib.animatable.instance.', 'software.bernie.geckolib.core.animatable.instance.')
        .replace('RenderUtil.', 'RenderUtils.')
        .replace('util.RenderUtil;', 'util.RenderUtils;')
        .replace('new AnimationState<>(animatable, 0, 0, partialTick, false), partialTick)', 'new AnimationState<>(animatable, 0, 0, partialTick, false))')
        .replace('fuzs.forgeconfigapiport.fabric.api.forge.v4.ForgeConfigRegistry', 'fuzs.forgeconfigapiport.api.config.v2.ForgeConfigRegistry')
        .replace('net.neoforged.fml.config.ModConfig', 'net.minecraftforge.fml.config.ModConfig')
        .replaceAll(/import net\.minecraft\.(?:core\.component\.\w+|network\.codec\.\w+);/, '')
        .replaceAll(/\b(?!components\b)(\w+)\.get\((ModDataComponent\.\w+)\)/, 'ModDataComponent.get($1, $2)')
        .replaceAll(/\b(?!components\b)(\w+)\.set\((ModDataComponent\.\w+), /, 'ModDataComponent.set($1, $2, ')
        .replaceAll(/\b(\w+)\.(has|remove)\((ModDataComponent\.\w+)\)/, 'ModDataComponent.$2($1, $3)')
        .replace('TooltipContext context,', 'net.minecraft.world.level.Level context,')
        .replace('net.minecraft.world.item.crafting.CraftingInput', 'net.minecraft.world.inventory.CraftingContainer')
        .replace('CraftingInput input', 'CraftingContainer input')
        .replace('input.ingredientCount()', 'input.getItems().stream().filter(s -> !s.isEmpty()).count()')
        .replace('input.size()', 'input.getContainerSize()')
        .replaceAll(/assemble\(CraftingContainer input, HolderLookup\.Provider registries\)/, 'assemble(CraftingContainer input, net.minecraft.core.RegistryAccess registries)')
        .replace('getUseDuration(stack, entity)', 'getUseDuration(stack)')
        .replace('getUseDuration(ItemStack stack, LivingEntity entity)', 'getUseDuration(ItemStack stack)')
        .replace('stack.consume(1, player);', 'if (!player.getAbilities().instabuild) stack.shrink(1);')
        .replace('blockEntityData.copyTag()', 'blockEntityData')
        .replace('giftBox.get(DataComponents.BLOCK_ENTITY_DATA)', 'BlockItem.getBlockEntityData(giftBox)')
        .replace('dolls.removeLast()', 'dolls.remove(dolls.size() - 1)')
        .replace('getUpdateTag(net.minecraft.core.HolderLookup.Provider registries)', 'getUpdateTag()')
        .replace('saveWithFullMetadata(registries)', 'saveWithFullMetadata()')
        .replace('protected void saveAdditional(net.minecraft.nbt.CompoundTag output, net.minecraft.core.HolderLookup.Provider registries)', 'protected void saveAdditional(net.minecraft.nbt.CompoundTag output)')
        .replace('protected void loadAdditional(net.minecraft.nbt.CompoundTag input, net.minecraft.core.HolderLookup.Provider registries)', 'public void load(net.minecraft.nbt.CompoundTag input)')
        .replace('super.loadAdditional(input, registries)', 'super.load(input)')
        .replace('super.saveAdditional(output, registries)', 'super.saveAdditional(output)')
        .replaceAll(/(LegacyDollNbt\.(?:store|read)\(.*), registries\)/, '$1, null)')
        .replace('protected void defineSynchedData(SynchedEntityData.Builder builder)', 'protected void defineSynchedData()')
        .replaceAll(/builder\.define\((DATA_\w+|CUSTOM_DOLL_ID),/, 'getEntityData().define($1,')
        .replace('Items.ENDER_PEARL, Items.WIND_CHARGE, Items.TOTEM_OF_UNDYING', 'Items.ENDER_PEARL, Items.TOTEM_OF_UNDYING')
        .replace('net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking;', 'com.kaleidoscopedoll.network.LegacyServerNetwork;')
        .replace('ServerPlayNetworking.', 'LegacyServerNetwork.')
        .replace('net.fabricmc.fabric.api.client.networking.v1.ClientPlayNetworking;', 'com.kaleidoscopedoll.network.LegacyClientNetwork;')
        .replace('ClientPlayNetworking.', 'LegacyClientNetwork.')
}

ext.translateBeforeComponentsClientPack = { String line, String version ->
    line = line
        .replaceAll(/import net\.minecraft\.server\.packs\.(?:PackLocationInfo|PackSelectionConfig);/, '')
        .replace('import java.util.Optional;', '')
        .replaceAll(/^\s*private static final PackSelectionConfig SELECTION = .+;$/, '')
        .replaceAll(/^\s*var location = new PackLocationInfo.+;$/, '')
        .replace('return Pack.readMetaAndCreate(location, new FilePackResources.FileResourcesSupplier(path), PackType.CLIENT_RESOURCES, SELECTION);',
                'return Pack.readMetaAndCreate(id, Component.literal(id), false, key -> new FilePackResources(key, path.toFile(), true), PackType.CLIENT_RESOURCES, Pack.Position.BOTTOM, PackSource.BUILT_IN);')
        .replace('var info = new PackLocationInfo("kaleidoscope_doll/custom/" + name, Component.literal(name),', 'String id = "kaleidoscope_doll/custom/" + name;')
        .replace('PackSource.BUILT_IN, Optional.empty());', '')
        .replace('Pack pack = Pack.readMetaAndCreate(info, new FilePackResources.FileResourcesSupplier(path), PackType.CLIENT_RESOURCES, SELECTION);',
                'Pack.ResourcesSupplier resources = key -> new FilePackResources(key, path.toFile(), true);\n        Pack.Info info = Pack.readPackInfo(id, resources);\n        Pack pack = info == null ? null : Pack.create(id, Component.literal(name), true, resources, info, PackType.CLIENT_RESOURCES, Pack.Position.BOTTOM, true, PackSource.BUILT_IN);')
    if (version != "1.20.1") {
        line = line.replace('key -> new FilePackResources(key, path.toFile(), true)', 'new FilePackResources.FileResourcesSupplier(path, true)')
            .replace('Pack.readPackInfo(id, resources)', 'Pack.readPackInfo(id, resources, net.minecraft.SharedConstants.getCurrentVersion().getPackVersion(PackType.CLIENT_RESOURCES))')
            .replace('resources, info, PackType.CLIENT_RESOURCES, Pack.Position.BOTTOM', 'resources, info, Pack.Position.BOTTOM')
    }
    return line
}

ext.translateBeforeComponentsBlockUse = { String line, String version ->
    if (version != "1.20.4") {
        line = line.replace('getCloneItemStack(LevelReader level,', 'getCloneItemStack(net.minecraft.world.level.BlockGetter level,')
    }
    line
        .replace('protected InteractionResult useWithoutItem(BlockState state, Level level, BlockPos pos, Player player, BlockHitResult hit)', 'public InteractionResult use(BlockState state, Level level, BlockPos pos, Player player, net.minecraft.world.InteractionHand hand, BlockHitResult hit)')
        .replace('protected InteractionResult useWithoutItem(BlockState blockState, Level level, BlockPos blockPos, Player player,', 'public InteractionResult use(BlockState blockState, Level level, BlockPos blockPos, Player player, net.minecraft.world.InteractionHand hand,')
        .replace('protected net.minecraft.world.ItemInteractionResult useItemOn(ItemStack itemInHand, BlockState blockstate, Level world, BlockPos pos, Player entity, InteractionHand hand, BlockHitResult hit) {', 'public InteractionResult use(BlockState blockstate, Level world, BlockPos pos, Player entity, InteractionHand hand, BlockHitResult hit) { ItemStack itemInHand = entity.getItemInHand(hand);')
        .replace('net.minecraft.world.ItemInteractionResult.PASS_TO_DEFAULT_BLOCK_INTERACTION', 'InteractionResult.PASS')
        .replace('net.minecraft.world.ItemInteractionResult.sidedSuccess(', 'InteractionResult.sidedSuccess(')
        .replace('super.useItemOn(itemInHand, blockstate, world, pos, entity, hand, hit)', 'super.use(blockstate, world, pos, entity, hand, hit)')
        .replace('protected RenderShape getRenderShape(', 'public RenderShape getRenderShape(')
        .replace('protected List<ItemStack> getDrops(', 'public List<ItemStack> getDrops(')
}
