ext.translateLegacyNbtLine = { String line ->
    line
        .replaceAll(/import net\.minecraft\.world\.level\.storage\.(?:Tag)?Value(?:Input|Output);/, '')
        .replace('import net.minecraft.util.ProblemReporter;', '')
        .replaceAll(/((?:save|load)Additional)\(Value(?:Input|Output) (\w+)\)/, '$1(net.minecraft.nbt.CompoundTag $2, net.minecraft.core.HolderLookup.Provider registries)')
        .replaceAll(/super\.((?:save|load)Additional)\((\w+)\)/, 'super.$1($2, registries)')
        .replaceAll(/\bValue(Input|Output)\b/, 'net.minecraft.nbt.CompoundTag')
        .replace('net.minecraft.core.component.DataComponentGetter', 'net.minecraft.world.level.block.entity.BlockEntity.DataComponentInput')
        .replaceAll(/(\w+)\.getStringOr\((\w+), StringUtils.EMPTY\)/, '$1.getString($2)')
        .replaceAll(/(\w+)\.get(Int|Boolean)Or\((\w+), (?:0|false)\)/, '$1.get$2($3)')
        .replaceAll(/(\w+)\.getFloatOr\(("[xyz]"), 0\)/, '$1.getFloat($2)')
        .replaceAll(/(\w+)\.getFloatOr\(("[xyz]"), defaultValue\)/, 'com.kaleidoscopedoll.compat.LegacyDollNbt.readFloat($1, $2, defaultValue)')
        .replaceAll(/\.getCompound\(("[\w]+"|TAG_BLOCK_STATE)\)\.orElse\((?:new CompoundTag\(\)|null)\)/, '.getCompound($1)')
        .replace('input.getString(TAG_CUSTOM_DOLL_ID).ifPresent(this::setCustomDollId);', 'setCustomDollId(input.getString(TAG_CUSTOM_DOLL_ID));')
        .replaceAll(/input\.child\((\w+)\)\.ifPresent\(child ->/, 'java.util.Optional.of(input.getCompound($1)).ifPresent(child ->')
        .replaceAll(/output\.child\((\w+)\)/, 'com.kaleidoscopedoll.compat.LegacyDollNbt.child(output, $1)')
        .replaceAll(/input\.read\((TAG_\w+), ([\w.]+)\)/, 'com.kaleidoscopedoll.compat.LegacyDollNbt.read(input, $1, $2, level().registryAccess())')
        .replaceAll(/output\.store\((TAG_\w+), ([\w.]+), (.*)\);/, 'com.kaleidoscopedoll.compat.LegacyDollNbt.store(output, $1, $2, $3, level().registryAccess());')
        .replaceAll(/input\.read\((NBT_KEY_AVAILABLE_DOLLS \+ i), DOLL_LIST_CODEC\)/, 'com.kaleidoscopedoll.compat.LegacyDollNbt.read(input, $1, DOLL_LIST_CODEC, registries)')
        .replaceAll(/output\.store\((NBT_KEY_AVAILABLE_DOLLS \+ i), DOLL_LIST_CODEC, (.*)\);/, 'com.kaleidoscopedoll.compat.LegacyDollNbt.store(output, $1, DOLL_LIST_CODEC, $2, registries);')
        .replace('input.read(NBT_DOLL_ITEMSTACK, ItemStack.CODEC)', 'com.kaleidoscopedoll.compat.LegacyDollNbt.read(input, NBT_DOLL_ITEMSTACK, ItemStack.CODEC, registries)')
        .replace('output.store(NBT_DOLL_ITEMSTACK, ItemStack.CODEC, dollItemStack)', 'com.kaleidoscopedoll.compat.LegacyDollNbt.store(output, NBT_DOLL_ITEMSTACK, ItemStack.CODEC, dollItemStack, registries)')
}

ext.translateLegacyCommonLine = { String line ->
    line
        .replace('software.bernie.geckolib.animatable.manager.AnimatableManager', 'software.bernie.geckolib.animation.AnimatableManager')
        .replace('software.bernie.geckolib.animatable.processing.AnimationController', 'software.bernie.geckolib.animation.AnimationController')
        .replace('registerSqueeze(AnimatableManager.ControllerRegistrar', 'registerSqueeze(GeoAnimatable animatable, AnimatableManager.ControllerRegistrar')
        .replace('registerSqueeze(controllers)', 'registerSqueeze(this, controllers)')
        .replace('new AnimationController<GeoAnimatable>(SQUEEZE,', 'new AnimationController<GeoAnimatable>(animatable, SQUEEZE,')
        .replace('new AnimationController<DollMachineBlockEntity>(LOTTERY,', 'new AnimationController<DollMachineBlockEntity>(this, LOTTERY,')
        .replace('fuzs.forgeconfigapiport.fabric.api.v5.ConfigRegistry', 'fuzs.forgeconfigapiport.fabric.api.forge.v4.ForgeConfigRegistry')
        .replace('ConfigRegistry.INSTANCE', 'ForgeConfigRegistry.INSTANCE')
        .replace('import net.minecraft.server.players.NameAndId;', '')
        .replace('new NameAndId(player.getGameProfile())', 'player.getGameProfile()')
        .replace('Commands.hasPermission(Commands.LEVEL_GAMEMASTERS)', 'source -> source.hasPermission(2)')
        .replace('Items.EGG, Items.BLUE_EGG, Items.BROWN_EGG,', 'Items.EGG,')
        .replace('import net.minecraft.world.item.component.TooltipDisplay;', '')
        .replaceAll(/TooltipDisplay display, Consumer<Component> (\w+)/, 'java.util.List<Component> $1')
        .replace('super.appendHoverText(stack, context, display,', 'super.appendHoverText(stack, context,')
        .replaceAll(/ClientHooks\.customDollTooltip\.accept\(modelId, (\w+)\)/, 'ClientHooks.customDollTooltip.accept(modelId, $1::add)')
        .replaceAll(/\b(list|tooltip|tooltips|tooltipComponents)\.accept\(/, '$1.add(')
        .replace('this.builder(', 'this.getOrCreateTagBuilder(')
        .replace('import net.minecraft.core.ClientAsset;', '')
        .replace('ClientAsset.ResourceTexture BACKGROUND = new ClientAsset.ResourceTexture(', 'ResourceLocation BACKGROUND =')
        .replace('"textures/advancement/background.png"));', '"textures/advancement/background.png");')
        .replace('!this.canSimulateMovement()', 'this.level().isClientSide')
        .replace('canBeCollidedWith(@Nullable Entity other)', 'canBeCollidedWith()')
        .replace('dollEntity.snapTo(', 'dollEntity.moveTo(')
}

ext.translateLegacyClientLine = { String line ->
    line
        .replaceAll(/import net\.minecraft\.client\.input\.\w+;/, '')
        .replace('import net.minecraft.client.renderer.RenderPipelines;', '')
        .replace('new DynamicTexture(() -> "custom_doll_" + name, image)', 'new DynamicTexture(image)')
        .replace('getWindow(), key)', 'getWindow().getWindow(), key)')
        .replace('setScreenAndShow(', 'setScreen(')
        .replace('hasShiftDown()', 'hasDollShiftDown()')
        .replace('hasControlDown()', 'hasDollControlDown()')
        .replace('RenderPipelines.GUI_TEXTURED', 'net.minecraft.client.renderer.RenderType::guiTextured')
        .replace('mouseClicked(MouseButtonEvent event, boolean doubleClick)', 'mouseClicked(double x, double y, int button)')
        .replace('mouseClicked(event, doubleClick)', 'mouseClicked(x, y, button)')
        .replace('mouseDragged(MouseButtonEvent event, double dragX, double dragY)', 'mouseDragged(double x, double y, int button, double dragX, double dragY)')
        .replace('mouseDragged(event, dragX, dragY)', 'mouseDragged(x, y, button, dragX, dragY)')
        .replace('event.x()', 'x').replace('event.y()', 'y')
        .replace('keyPressed(KeyEvent event)', 'keyPressed(int keyCode, int scanCode, int modifiers)')
        .replace('keyPressed(event)', 'keyPressed(keyCode, scanCode, modifiers)')
        .replace('event.key()', 'keyCode')
        .replace('charTyped(CharacterEvent event)', 'charTyped(char codePoint, int modifiers)')
        .replace('charTyped(event)', 'charTyped(codePoint, modifiers)')
        .replace('onClick(MouseButtonEvent event, boolean doubleClick)', 'onClick(double mouseX, double mouseY)')
        .replace('event.hasDollShiftDown()', 'net.minecraft.client.gui.screens.Screen.hasShiftDown()')
        .replace('graphics.setTooltipForNextFrame(Component', 'graphics.renderTooltip(this.font, Component')
        .replace('graphics.setTooltipForNextFrame(Minecraft', 'graphics.renderTooltip(Minecraft')
        .replace('ItemDisplayContext.HEAD, entity)', 'ItemDisplayContext.HEAD, false, entity)')
}
