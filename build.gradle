import groovy.json.JsonOutput
import groovy.json.JsonSlurper

plugins {
    id 'eclipse'
    id 'idea'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" apply false
}

def target = providers.gradleProperty("minecraftTarget").orElse(project.minecraft_version).get()
def targets = [
    "1.20.1": [fabric: "0.92.12+1.20.1", gecko: "rt5We1KU", geckoVersion: "4.8.6", config: "HvR3IdRE", jei: "ULSjaCQA", resourcePack: [15, 0], dataPack: [15, 0], java: 17],
    "1.21.1": [fabric: "0.116.18+1.21.1", gecko: "ET6x3zyz", geckoVersion: "4.9.5", config: "N5qzq0XV", jei: "rgEqZub8", resourcePack: [34, 0], dataPack: [48, 0], java: 21],
    "1.21.4": [fabric: "0.119.4+1.21.4", gecko: "HFSs3Co0", geckoVersion: "4.8.5", config: "SSKF75hc", nightConfig: "3.8.1", resourcePack: [46, 0], dataPack: [61, 0], java: 21],
    "1.21.10": [fabric: "0.138.4+1.21.10", gecko: "7qjQQSWv", geckoVersion: "5.3-alpha-3", config: "IKHTwwTv", jei: "8yGN172x", resourcePack: [69, 0], dataPack: [88, 0], java: 21],
    "26.1":   [fabric: "0.145.1+26.1", gecko: "yUpAp23B", geckoVersion: "5.5", config: "J2q1Fj7S", jei: "W10KOrSH", resourcePack: [84, 0], dataPack: [101, 1]],
    "26.1.2": [fabric: "0.155.3+26.1.2", gecko: "rZnYqWVd", geckoVersion: "5.5.3", config: "jUe0ucoE", jei: "J55aCpsE", resourcePack: [84, 0], dataPack: [101, 1]],
    "26.2":   [fabric: "0.161.0+26.2", gecko: "FJ4Z5QYo", geckoVersion: "5.5.7", config: "rSd3GiG8", jei: "j62WSkzi", resourcePack: [88, 0], dataPack: [107, 1]],
    (project.minecraft_version): [
        fabric: project.fabric_version, geckoVersion: project.geckolib_version,
        config: project.forge_config_api_port_version, resourcePack: [97, 1], dataPack: [121, 0]
    ]
]
def profile = targets[target]
if (profile == null) {
    throw new GradleException("Unsupported Minecraft target '${target}'. Use one of: ${targets.keySet().join(', ')}")
}
def compatibility = target == project.minecraft_version ? "26.3" : "26.1-26.2"
def minecraftDependency = target == project.minecraft_version ? "~${target}" : target
def javaRelease = profile.java ?: 25
def remapped = javaRelease < 25
apply plugin: (remapped ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom')
apply from: 'gradle/legacy-resources.gradle'

version = project.mod_version.toString().replace("+mc${project.minecraft_version}", "+mc${target}")
group = project.maven_group
layout.buildDirectory = layout.projectDirectory.dir(target == project.minecraft_version ? "build" : "build/minecraft-${target}")

base {
    archivesName = "kaleidoscopedoll-${target}-fabric"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "kaleidoscopedoll" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    main.resources.srcDir("src/main/generated")
    main.java.srcDir("src/compat/${compatibility}/main")
    client.java.srcDir("src/compat/${compatibility}/client")
    def minorCompatibility = remapped || target in ["26.1", "26.1.2"] ? "26.1" : "26.2+"
    main.java.srcDir("src/compat/${minorCompatibility}/main")
    client.java.srcDir("src/compat/${minorCompatibility}/client")
}
if (remapped) {
    ext.legacyMinecraftTarget = target
    ext.legacyHasJei = profile.containsKey("jei")
    apply from: 'gradle/legacy-sources.gradle'
}

fabricApi {
    configureDataGeneration {
        client = true
        addToResources = false
        if (providers.gradleProperty("minecraftTarget").isPresent()) {
            outputDirectory.set(layout.buildDirectory.file("generated-data"))
        }
    }
    configureTests {
        createSourceSet = true
        enableClientGameTests = false
        clearRunDirectory = false
    }
}
if (target != project.minecraft_version) {
    loom.runs.configureEach {
        runDir("build/minecraft-${target}/run/${name}")
    }
}

if (target in ["1.20.1", "1.21.1", "1.21.4"]) {
    def legacyTests = tasks.register("translateLegacyGameTests", Sync) {
        inputs.property("target", target)
        from("src/gametest/java") {
            filter { String line ->
                line = line.replace("net.fabricmc.fabric.api.gametest.v1.GameTest;", "net.minecraft.gametest.framework.GameTest;")
                        .replaceAll(/@GameTest$/, '@GameTest(template = "fabric-gametest-api-v1:empty")')
                        .replace("@GameTest(maxTicks =", '@GameTest(template = "fabric-gametest-api-v1:empty", timeoutTicks =')
                if (target == "1.20.1") {
                    line = line.replace("test.makeMockPlayer(GameType.SURVIVAL)", "test.makeMockPlayer()")
                            .replace(".useItemOn(token, level, player,", ".use(level, player,")
                }
                return line
            }
        }
        into(layout.buildDirectory.dir("legacy-gametests"))
    }
    sourceSets.gametest.java.setSrcDirs([legacyTests])
}

repositories {
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup("com.geckolib")
            includeGroup("com.eliotlash.mclib")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${target}"
    if (remapped) {
        mappings loom.officialMojangMappings()
    }
    def modImplementationScope = remapped ? "modImplementation" : "implementation"
    add(modImplementationScope, "net.fabricmc:fabric-loader:${project.loader_version}")
    add(modImplementationScope, "net.fabricmc.fabric-api:fabric-api:${profile.fabric}")
    add(modImplementationScope, profile.gecko ? "maven.modrinth:geckolib:${profile.gecko}" :
            "com.geckolib:geckolib-fabric-${target}:${profile.geckoVersion}")
    add(modImplementationScope, "maven.modrinth:forge-config-api-port:${profile.config}")
    if (profile.jei || !remapped) {
        add(remapped ? "modCompileOnly" : "compileOnly", profile.jei ? "maven.modrinth:jei:${profile.jei}" :
                "mezz.jei:jei-${target}-fabric:${project.jei_version}")
    }

    if (target == "1.20.1") {
        // The published GeckoLib jar includes McLib, but Loom strips its nested jar metadata.
        localRuntime "com.eliotlash.mclib:mclib:20"
    } else {
        // Loom does not put Forge Config API Port's nested Java libraries on the dev classpath.
        def nightConfig = profile.nightConfig ?: project.night_config_version
        compileOnly "com.electronwill.night-config:core:${nightConfig}"
        localRuntime "com.electronwill.night-config:core:${nightConfig}"
        localRuntime "com.electronwill.night-config:toml:${nightConfig}"
    }
}

processResources {
    def legacyDataPaths = target == "1.20.1"
    inputs.file(layout.projectDirectory.file("gradle/legacy-resources.gradle"))
    inputs.property "version", project.version
    inputs.property "minecraft_version", minecraftDependency
    inputs.property "loader_version", project.loader_version
    inputs.property "geckolib_version", profile.geckoVersion
    inputs.property "java_version", javaRelease
    inputs.property "resource_pack", profile.resourcePack
    inputs.property "data_pack", profile.dataPack
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": minecraftDependency,
                "loader_version": project.loader_version,
                "geckolib_version": profile.geckoVersion,
                "java_version": javaRelease
    }

    filesMatching("pack.mcmeta") {
        expand "resource_pack": profile.resourcePack, "data_pack": profile.dataPack
    }

    if (legacyDataPaths) {
        filesMatching("data/**/*.json") {
            def parts = path.split("/", 3)
            def mapping = parts.length == 3 ? legacyDataDirectories.find { key, _ -> parts[2].startsWith("${key}/") } : null
            if (mapping != null) {
                path = "${parts[0]}/${parts[1]}/${mapping.value}${parts[2].substring(mapping.key.length())}"
            }
        }
    }

    if (target != project.minecraft_version) {
        doLast {
            // 26.3 collapsed loot conditions; older versions expect a list at each pool/entry.
            def restoreConditions = { Map node ->
                def condition = node.remove("condition")
                if (condition == null) return
                def restored = switch (condition.type) {
                    case "minecraft:survives_explosion" -> [condition: condition.type]
                    case "minecraft:match_block" -> [
                        condition: "minecraft:block_state_property", block: condition.blocks, properties: condition.state
                    ]
                    default -> throw new GradleException("Unsupported legacy loot condition: ${condition.type}")
                }
                node.conditions = [restored]
            }
            fileTree(destinationDir) {
                include "data/kaleidoscope_doll/${legacyDataPaths ? 'loot_tables' : 'loot_table'}/**/*.json"
            }.each { file ->
                def table = new JsonSlurper().parse(file)
                table.pools.each { pool ->
                    restoreConditions(pool)
                    pool.entries.each(restoreConditions)
                    if (minorLootNeedsBonusRolls(target) && !pool.containsKey("bonus_rolls")) {
                        pool.bonus_rolls = 0
                    }
                }
                file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(table)) + "\n", "UTF-8")
            }
            if (remapped) {
                def metadataFile = new File(destinationDir, "pack.mcmeta")
                def metadata = new JsonSlurper().parse(metadataFile)
                metadata.pack.pack_format = profile.resourcePack[0]
                metadata.pack.supported_formats = [profile.resourcePack[0], target == "1.21.10" ? 81 : profile.dataPack[0]]
                metadataFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(metadata)) + "\n", "UTF-8")
            }
            if (remapped && !profile.jei) {
                def manifestFile = new File(destinationDir, "fabric.mod.json")
                def manifest = new JsonSlurper().parse(manifestFile)
                manifest.entrypoints.remove("jei_mod_plugin")
                manifestFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(manifest)) + "\n", "UTF-8")
            }
            if (target in ["1.20.1", "1.21.1", "1.21.4"]) {
                def mixinFile = new File(destinationDir, "kaleidoscope_doll.mixins.json")
                def mixins = new JsonSlurper().parse(mixinFile)
                if (target == "1.21.4") {
                    mixins.client.add("client.DollLayerPoseMixin")
                } else {
                    mixins.client.removeAll(["client.CuboidItemModelWrapperMixin", "client.EntityRendererMixin",
                                             "client.EntityRenderStateMixin", "client.LivingEntityRendererMixin"])
                    mixins.client.add("client.ItemRendererMixin")
                }
                if (target == "1.20.1") {
                    mixins.mixins.removeAll(["AbstractHurtingProjectileMixin",
                                            "AbstractWindChargeMixin", "WindChargeItemMixin"])
                    mixins.client.remove("client.WindChargeRendererMixin")
                }
                mixins.compatibilityLevel = "JAVA_${javaRelease}"
                mixinFile.setText(JsonOutput.prettyPrint(JsonOutput.toJson(mixins)) + "\n", "UTF-8")
            }
            fileTree(destinationDir) {
                include "data/kaleidoscope_doll/${legacyDataPaths ? 'advancements' : 'advancement'}/**/*.json"
            }.each { file ->
                def advancement = new JsonSlurper().parse(file)
                boolean changed = false
                advancement.criteria?.values()?.each { criterion ->
                    if (criterion.trigger == "minecraft:recipe_unlocked" && criterion.conditions.containsKey("recipes")) {
                        def recipe = criterion.conditions.remove("recipes")
                        if (!(recipe instanceof String)) {
                            throw new GradleException("Legacy recipe unlock conditions require one recipe: ${file}")
                        }
                        criterion.conditions.recipe = recipe
                        changed = true
                    }
                }
                if (remapped && advancement.display?.icon && !advancement.display.icon.containsKey("count")) {
                    advancement.display.icon.count = 1
                    changed = true
                }
                if (changed) file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(advancement)) + "\n", "UTF-8")
            }
            if (remapped) {
                fileTree(destinationDir) {
                    include "data/kaleidoscope_doll/${legacyDataPaths ? 'recipes' : 'recipe'}/**/*.json"
                }.each { file ->
                    def recipe = new JsonSlurper().parse(file)
                    if (recipe.type == "minecraft:stonecutting" && !recipe.result.containsKey("count")) {
                        recipe.result.count = 1
                        file.setText(JsonOutput.prettyPrint(JsonOutput.toJson(recipe)) + "\n", "UTF-8")
                    }
                }
            }
            restoreLegacyResources(destinationDir, target)
        }
    }
    if (target in ["1.20.1", "1.21.1", "1.21.4"]) {
        filesMatching("assets/kaleidoscope_doll/geckolib/**/*.json") {
            def mapped = relativePath.segments.toList()
            mapped.remove(2)
            if (mapped[2] == "models") mapped[2] = "geo"
            relativePath = new RelativePath(true, mapped as String[])
        }
    }
}

static boolean minorLootNeedsBonusRolls(String target) {
    return target in ["1.20.1", "1.21.1", "1.21.4", "1.21.10", "26.1", "26.1.2"]
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(javaRelease)
    if (target in ["1.20.1", "1.21.1"]) it.options.compilerArgs.addAll(["-Xmaxerrs", "1000"])
}

def runtimeJava = providers.gradleProperty("minecraftRuntimeJava").map { Integer.parseInt(it) }.orElse(javaRelease)
tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion.set(runtimeJava.map { JavaLanguageVersion.of(it) })
    }
}

tasks.named('jar', Jar) {
    from('LICENSE')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaRelease)
    withSourcesJar()
}
