plugins {
    id 'eclipse'
    id 'idea'
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = "kaleidoscopedoll-${minecraft_version}-fabric"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "kaleidoscopedoll" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    maven {
        name = "GeckoLib"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup("com.geckolib")
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    implementation "com.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"
    implementation("maven.modrinth:forge-config-api-port:${project.forge_config_api_port_version}")
    implementation "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

    compileOnly "com.electronwill.night-config:core:${project.night_config_version}"
    localRuntime "com.electronwill.night-config:core:${project.night_config_version}"
    localRuntime "com.electronwill.night-config:toml:${project.night_config_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "geckolib_version", project.geckolib_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "geckolib_version": project.geckolib_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(25)
}

tasks.named('jar', Jar) {
    from('LICENSE')
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
